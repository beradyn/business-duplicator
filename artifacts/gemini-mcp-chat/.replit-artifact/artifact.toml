kind = "web"
previewPath = "/"
title = "Gemini MCP Chat"
description = "A dark Gemini chatbot for safe MCP server controls and status."
version = "1.0.0"
id = "artifacts/gemini-mcp-chat"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24409

[services.development]
run = "pnpm --filter @workspace/gemini-mcp-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gemini-mcp-chat", "run", "build" ]
serve = "static"
publicDir = "artifacts/gemini-mcp-chat/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24409"
BASE_PATH = "/"
