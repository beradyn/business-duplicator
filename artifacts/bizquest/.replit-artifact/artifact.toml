kind = "mobile"
previewPath = "/bizquest/"
title = "BizQuest"
description = "A playful mobile learning game for ages 5–17 where young entrepreneurs start a business, manage money and products, solve business challenges, customize an avatar, and earn XP, points, and badges."
version = "1.0.0"
id = "artifacts/bizquest"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/bizquest/" ]
localPort = 21828

[services.development]
run = "pnpm --filter @workspace/bizquest run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bizquest", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bizquest", "run", "serve" ]

[services.env]
PORT = "21828"
BASE_PATH = "/bizquest/"
